# Configuration for Adaptive Multi-Level TinyML Intrusion Detection System

seed: 42

paths:
  raw_data: "data/raw/iiot_intrusion_dataset.csv"
  processed_data: "data/processed/processed_dataset.npz"
  data_summary: "data/processed/data_summary.json"
  models_dir: "models"
  results_dir: "results"
  figures_dir: "results/figures"
  tables_dir: "results/tables"
  experiments_dir: "results/experiments"

dataset:
  name: "Edge-IIoTset Cybersecurity Dataset"
  target_col: "Attack_type"
  binary_col: "Attack_label"
  sample_size: 25000
  test_size: 0.2
  val_size: 0.1
  drop_features:
    - "frame.time"
    - "ip.src"
    - "ip.dst"
    - "arp.src.proto_ipv4"
    - "arp.dst.proto_ipv4"
    - "http.file_data"
    - "tcp.payload"

models:
  lightweight:
    type: "DecisionTreeClassifier"
    params:
      max_depth: 4
      min_samples_leaf: 5
      criterion: "gini"
      random_state: 42
    est_inference_latency_ms: 0.12
    est_ram_kb: 4.5
    est_energy_uJ_per_inf: 8.5
    
  medium:
    type: "RandomForestClassifier"
    params:
      n_estimators: 25
      max_depth: 10
      random_state: 42
      n_jobs: -1
    est_inference_latency_ms: 1.45
    est_ram_kb: 48.0
    est_energy_uJ_per_inf: 62.0

  heavy:
    type: "PacketCNNClassifier"
    params:
      epochs: 60
      batch_size: 256
      learning_rate: 0.0005
      patience: 8
      random_state: 42
    est_inference_latency_ms: 0.42
    est_ram_kb: 320.0
    est_energy_uJ_per_inf: 340.0

federated:
  num_clients: 5
  num_rounds: 10
  local_epochs: 3
  batch_size: 64
  learning_rate: 0.01
  dirichlet_alpha: 0.5  # Controls non-IID heterogeneity (lower = more non-IID)
  client_selection:
    strategy: "energy_aware"  # "standard" or "energy_aware"
    min_battery_threshold: 20.0
    battery_weight: 0.6
    data_size_weight: 0.4

threat_scoring:
  weights:
    confidence: 0.25
    severity: 0.45
    anomaly_frequency: 0.30
  thresholds:
    low: 30
    medium: 60
    high: 80
  severity_scores:
    Normal: 0
    Scanning: 35
    PortScan: 40
    SQL_Injection: 60
    Backdoor: 75
    DDoS: 90
    Ransomware: 95

energy_simulation:
  initial_battery_pct: 100.0
  battery_capacity_mAh: 1200.0
  voltage_v: 3.3
  idle_power_mW: 15.0
  comm_energy_uJ_per_kb: 45.0
  fed_train_energy_uJ_per_epoch: 12500.0

adaptive_switching:
  utility_weights:
    threat_weight: 0.50
    energy_weight: 0.30
    latency_weight: 0.20
  battery_critical_pct: 15.0
  battery_low_pct: 35.0

simulation:
  realtime_speed_hz: 5
  default_events_count: 200
